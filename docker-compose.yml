# Dedicated, throw-away PostgreSQL for the Backend Agent's integration tests (mirrors the Database Agent's compose file).
# Never point TEST_DATABASE_URL at a production database: tests create and drop their own schemas but also truncate tables inside them.
#   docker compose up -d
#   export TEST_DATABASE_URL=postgresql://backend_agent:backend_agent_dev_only@127.0.0.1:5433/backend_agent_test
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: backend_agent
      POSTGRES_PASSWORD: ${BACKEND_AGENT_TEST_DB_PASSWORD:-backend_agent_dev_only}
      POSTGRES_DB: backend_agent_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_agent -d backend_agent_test"]
      interval: 3s
      timeout: 3s
      retries: 20
