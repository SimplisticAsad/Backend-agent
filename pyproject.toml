[project]
name = "backend-agent"
version = "0.1.0"
description = "Backend Agent: turns validated Graph-Agent specifications + a Database-Agent contract into a tested FastAPI/PostgreSQL backend."
# Written to run on 3.11 and 3.12+ (no 3.12-only syntax). The target is 3.12+, but the CI sandbox is 3.11.
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.5",
  "email-validator>=2.0",
  "psycopg[binary,pool]>=3.1",
  "pyjwt>=2.8",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pytest>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
backend-agent = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: needs a real PostgreSQL (auto-provisioned or TEST_DATABASE_URL)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md", "generation/runtime/**/*", "generation/test_templates/**/*"]
