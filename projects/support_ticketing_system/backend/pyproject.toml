[project]
name = "support-ticketing-system-backend"
version = "0.1.0"
description = "Generated backend for Support Ticketing System"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "pydantic>=2.5", "email-validator>=2.0", "psycopg[binary,pool]>=3.1", "pyjwt>=2.8", "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: needs a real PostgreSQL"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
